services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab
      POSTGRES_DB: lab
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - checkpoints:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "lab", "-d", "lab"]
      interval: 2s
      timeout: 3s
      retries: 20

  temporal:
    image: temporalio/temporal:1.10.1
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--db-filename", "/home/temporal/temporal.db"]
    ports:
      - "127.0.0.1:7233:7233"
      - "127.0.0.1:8233:8233"
    volumes:
      - temporal-history:/home/temporal
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health"]
      interval: 2s
      timeout: 3s
      retries: 20

  restate:
    image: docker.restate.dev/restatedev/restate:1.8.1
    profiles: [restate]
    ports:
      - "127.0.0.1:8090:8080"
      - "127.0.0.1:9070:9070"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - restate-journal:/restate-data

volumes:
  checkpoints:
  temporal-history:
  restate-journal:
