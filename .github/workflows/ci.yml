name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/api-py/requirements.txt
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: apps/api-java/pom.xml
      - name: Install dependencies
        run: make install install-py
      - name: Run tests
        run: make test
      - name: Build and test Java
        run: make build-java
      - name: Test recovery against PostgreSQL and Temporal
        run: make test-integration
      - name: Build
        run: make build
